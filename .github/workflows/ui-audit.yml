name: UI Audit

on:
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  ui-audit:
    name: Kinetic UI UX Pro audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AST audit SARIF
        run: |
          python scripts/ast_audit.py ./templates --format sarif --fail-on NONE > ui-audit.sarif

      - name: Upload AST audit SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ui-audit.sarif

      - name: Verify design-token contrast
        run: |
          schemas="$(find . \( -name tokens.schema.json -o -name tokens.json \) -not -path './.ds-index/*')"
          test -n "$schemas"
          while IFS= read -r schema; do
            python scripts/token_gen.py "$schema" --verify
          done <<< "$schemas"

      - name: Build design-system index
        continue-on-error: true
        run: |
          python scripts/ds_index.py --build . --stats

      - name: Report design-token drift
        continue-on-error: true
        run: |
          python scripts/ds_search.py drift ./templates
