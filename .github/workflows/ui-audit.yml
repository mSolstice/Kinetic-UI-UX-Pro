name: UI Audit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  ui-audit:
    name: Kinetic UI UX Pro audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python dependency integrity
        run: |
          python -m pip check

      - name: Compile Python scripts
        run: |
          PYTHONPYCACHEPREFIX=/tmp/kinetic-pycache python -m py_compile scripts/*.py codex/evals/run_evals.py

      - name: Check plugin script manifest sync
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path("docs/script-catalog.json").read_text())
          listed = set(catalog["scripts"])
          actual = {str(path) for path in Path("scripts").glob("*.py")}
          missing = sorted(actual - listed)
          stale = sorted(listed - actual)
          if missing or stale:
              print("missing_in_plugin", missing)
              print("listed_missing_file", stale)
              raise SystemExit(1)
          PY

      - name: Check dependency licenses
        run: |
          python scripts/license_check.py

      - name: Audit Python vulnerabilities
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt

      - name: Run AST audit SARIF
        run: |
          python scripts/ast_audit.py ./templates --format sarif --fail-on NONE > ui-audit.sarif

      - name: Upload AST audit SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ui-audit.sarif

      - name: Verify design-token contrast
        run: |
          schemas="$(find . \( -name tokens.schema.json -o -name tokens.json \) -not -path './.ds-index/*')"
          test -n "$schemas"
          while IFS= read -r schema; do
            python scripts/token_gen.py "$schema" --verify
          done <<< "$schemas"

      - name: Verify palette seeds
        run: |
          python scripts/palette_search.py verify-all

      - name: Verify industry rule count
        run: |
          python scripts/industry_check.py --count

      - name: Build design-system index
        run: |
          python scripts/ds_index.py --build . --stats

      - name: Report design-token drift
        continue-on-error: true
        run: |
          python scripts/ds_search.py drift ./templates
